name: Build Android & iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EmergencyApp-Android.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log || {
            echo "::error::Flutter build iOS failed! Inspecting log tail:"
            tail -n 120 ios_build.log
            exit 1
          }

      - name: Package IPA for Sideloading / Testing
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r EmergencyApp.ipa Payload
        shell: bash

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: EmergencyApp-iOS.ipa
          path: build/ios/iphoneos/EmergencyApp.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios_build.log
